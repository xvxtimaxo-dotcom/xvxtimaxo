<style>
/* Layout: one narrow mobile column (login -> tabbed console), centered on wide screens.
   Look: near-black with a red undertone, mono type, crimson accent taken from the scorpion art. */
:root {
  --bg: #060304;
  --surface: #0d0709;
  --surface-2: #140b0e;
  --line: #2b1519;
  --line-strong: #4a1a20;
  --fg: #ede2e3;
  --muted: #8b7376;
  --faint: #55403f;
  --accent: #ff2433;
  --accent-deep: #7d0b16;
  --accent-ink: #1a0407;
  --warn: #f0b13c;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-ar: "Cairo", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.5;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  background-image: radial-gradient(ellipse 70% 38% at 50% 0%, rgba(255,36,51,.13), transparent 70%);
  background-repeat: no-repeat;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { width: 100%; max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.shell.ar { font-family: var(--font-ar); }
.shell.ar * { letter-spacing: 0 !important; text-transform: none !important; }
.shell.ar .mono { font-family: var(--font-mono); }

/* ---------- Login ---------- */
.screen { flex: 1; display: flex; flex-direction: column; min-height: 100%; padding-block: 18px 28px; }
.topline { display: flex; justify-content: space-between; align-items: center; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.topline .tag { display: inline-flex; align-items: center; gap: 8px; }
.topline .tag i { width: 5px; height: 5px; background: var(--accent); display: block; box-shadow: 0 0 8px var(--accent); }
.topline .locked { color: var(--accent); }

.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding-block: 28px; min-height: 250px; }
.logo { will-change: transform; width: min(64%, 250px); height: auto; display: block; filter: drop-shadow(0 0 26px rgba(255,36,51,.38)); animation: float 6s ease-in-out infinite; }
.wordmark { font-weight: 700; font-size: 15px; letter-spacing: .5em; padding-inline-start: .5em; color: var(--fg); text-transform: uppercase; }
.wordmark b { color: var(--accent); font-weight: 700; }
@keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

.field-label { display: block; font-size: 10px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.input {
  width: 100%; height: 52px; padding: 0 16px; background: #000; border: 1px solid var(--line-strong);
  border-radius: 3px; color: var(--fg); font-size: 15px; letter-spacing: .14em; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.input::placeholder { color: var(--faint); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 18px rgba(255,36,51,.28); }
.input.bad { border-color: var(--accent); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px) } 75% { transform: translateX(4px) } }

.btn {
  width: 100%; height: 52px; margin-top: 14px; background: linear-gradient(180deg, #1a070b, #10040a);
  border: 1px solid var(--accent); border-radius: 3px; color: var(--fg);
  font-weight: 700; font-size: 12px; letter-spacing: .38em; text-transform: uppercase;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  transition: background .15s, box-shadow .15s, color .15s;
}
.btn:hover { background: var(--accent-deep); box-shadow: 0 0 20px rgba(255,36,51,.3); }
.btn:disabled { opacity: .75; cursor: progress; }
.spin { width: 14px; height: 14px; border: 2px solid var(--faint); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.err { min-height: 18px; margin: 10px 0 0; color: var(--accent); font-size: 11px; }
.note { margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.7; max-width: 38ch; }

/* ---------- Tabs ---------- */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); padding-block: 6px 0; }
.tabs nav { display: flex; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.tabs nav::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 18px 14px 14px; font-size: 11px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab:first-child { padding-inline-start: 0; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); font-weight: 700; border-bottom-color: var(--accent); }
.lang { margin-inline-start: auto; background: none; border: 1px solid var(--line-strong); border-radius: 2px; width: 44px; height: 30px; font-size: 10px; letter-spacing: .15em; color: var(--muted); }
.lang:hover { color: var(--fg); border-color: var(--accent); }

.panel { padding-block: 22px 40px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.panel[hidden] { display: none; }

/* ---------- Control ---------- */
.control { justify-content: space-between; min-height: calc(100vh - 80px); gap: 24px; }
.control .hero { min-height: 0; padding-block: 10px; }
.rows { display: flex; flex-direction: column; gap: 14px; font-size: 11px; }
.row { display: flex; align-items: center; gap: 14px; }
.row dt { margin: 0; flex: none; width: 82px; color: var(--muted); text-transform: uppercase; letter-spacing: .18em; font-size: 10px; }
.row .rule { flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent 120%); }
.row dd { margin: 0; color: var(--fg); display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 6px; height: 6px; background: var(--accent); box-shadow: 0 0 8px var(--accent); display: inline-block; }
dl { margin: 0; }

/* ---------- Modules ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.off .sub { opacity: .5; pointer-events: none; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; min-width: 0; }
.title svg { width: 14px; height: 14px; flex: none; color: var(--muted); }
.risk { font-size: 9px; letter-spacing: .12em; color: var(--warn); background: rgba(240,177,60,.14); padding: 2px 7px; border-radius: 2px; font-weight: 700; }
#p-modules .card { position: relative; border-color: rgba(255,36,51,.7); box-shadow: 0 0 14px rgba(255,36,51,.28); }
#p-modules .card::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none; box-shadow: 0 0 26px rgba(255,36,51,.55), inset 0 0 18px rgba(255,36,51,.14); opacity: 0; animation: edgeGlow 2.8s ease-in-out infinite alternate; will-change: opacity; }
@keyframes edgeGlow { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { #p-modules .card::after { animation: none; opacity: .6; } }
.subscribe { display: flex; gap: 8px; align-items: stretch; }
.subscribe[hidden] { display: none; }
.subscribe .btn { flex: 1; margin-top: 0; text-decoration: none; display: flex; align-items: center; justify-content: center; }
.ghost-btn { background: transparent; color: var(--fg); border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 14px; font: inherit; font-size: 12px; cursor: pointer; }
.ghost-btn:active { background: var(--surface-2); }
* { -webkit-tap-highlight-color: transparent; }
button, a, .tab { touch-action: manipulation; }
/* main screen sizing (login screen keeps the original look) */
#app .logo { filter: drop-shadow(0 0 22px rgba(255,36,51,.38)); }
#app .wordmark { font-size: 16px; }
#app .control { min-height: calc(100vh - 90px); min-height: calc(100dvh - 90px); justify-content: space-between; gap: 20px; }
#app .control .hero { flex: 1; justify-content: center; gap: 16px; padding-block: 8px; min-height: 0; }
#app .rows { gap: 20px; font-size: 13px; }
#app .row dt { width: 104px; font-size: 12px; }
#app .row dd { font-size: 14px; }
#app .btn { height: 58px; font-size: 13px; }
#app .panel { padding-block: 18px 28px; }
#p-modules { gap: 14px; }
#p-modules .card { padding: 16px 16px; gap: 14px; border-radius: 8px; background: linear-gradient(180deg, #120709, #0b0507); transition: background .2s; }
#p-modules .card:not(.off) { background: linear-gradient(180deg, #2a090f, #140508); }
#p-modules .title { font-size: 16px; font-weight: 700; letter-spacing: .1em; gap: 12px; color: var(--fg); }
#p-modules .title svg { width: 38px; height: 38px; padding: 9px; color: var(--accent); border: 1px solid rgba(255,36,51,.55); border-radius: 10px; background: rgba(255,36,51,.1); box-shadow: 0 0 14px rgba(255,36,51,.25); }
#p-modules .switch { width: 52px; height: 30px; border-radius: 15px; }
#p-modules .switch::after { top: 3px; inset-inline-start: 3px; width: 24px; height: 24px; }
#p-modules .switch[aria-checked="true"]::after { transform: translateX(22px); }
.shell.ar #p-modules .switch[aria-checked="true"]::after { transform: translateX(-22px); }
.meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.desc.safe { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 16px; border: 1px solid rgba(61,220,132,.55); background: rgba(61,220,132,.12); color: #3ddc84; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: none; line-height: 1; }
.desc.safe::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 8px #3ddc84; }
.state { font-size: 13px; font-weight: 600; color: var(--muted); }
.card:not(.off) .state { color: var(--fg); }
.desc { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.7; }

.switch { flex: none; width: 46px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: #2a2224; position: relative; transition: background .18s; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #a79b9d; transition: transform .18s, background .18s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { background: #fff; transform: translateX(20px); }
.ar .switch[aria-checked="true"]::after { transform: translateX(-20px); }
.switch.small { width: 40px; height: 22px; border-radius: 11px; }
.switch.small::after { width: 16px; height: 16px; }
.switch.small[aria-checked="true"]::after { transform: translateX(18px); }
.ar .switch.small[aria-checked="true"]::after { transform: translateX(-18px); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--surface-2); border: 1px solid transparent; border-radius: 999px; padding: 7px 14px; font-size: 11px; color: var(--muted); transition: background .15s, color .15s; }
.chip:hover { color: var(--fg); }
.chip[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 700; }

.subrow { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-size: 11px; color: var(--muted); }
.subs { display: flex; flex-direction: column; gap: 10px; }

.slider { display: flex; flex-direction: column; gap: 8px; transition: opacity .15s; }
.slider.dim { opacity: .4; pointer-events: none; }
.slider .meta { display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .24em; text-transform: uppercase; color: var(--faint); }
.slider .meta b { color: var(--muted); font-weight: 500; letter-spacing: .05em; font-size: 11px; }
input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; direction: ltr; }
input[type="range"]::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(90deg, var(--accent) var(--p, 100%), #2a2224 var(--p, 100%)); border-radius: 2px; }
input[type="range"]::-moz-range-track { height: 3px; background: #2a2224; border-radius: 2px; }
input[type="range"]::-moz-range-progress { height: 3px; background: var(--accent); border-radius: 2px; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); margin-top: -6.5px; }
input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; border-radius: 50%; background: #fff; border: 4px solid var(--accent); }

/* ---------- System ---------- */
.list { display: flex; flex-direction: column; }
.item { display: flex; align-items: flex-start; gap: 14px; width: 100%; text-align: start; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 18px 2px; }
.item:hover .arrow { color: var(--accent); }
.item .n { color: var(--accent); font-size: 10px; font-weight: 700; padding-top: 4px; }
.item .t { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.item .t b { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; font-weight: 700; }
.item .t span { color: var(--muted); font-size: 12px; }
.arrow { color: var(--faint); padding-top: 2px; }
.ar .arrow { transform: scaleX(-1); }
.foot { margin-top: auto; padding-top: 28px; text-align: center; font-size: 10px; letter-spacing: .3em; color: var(--faint); text-transform: uppercase; }
.foot b { color: var(--accent); }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); max-width: calc(100% - 32px); background: var(--surface-2); border: 1px solid var(--accent); padding: 12px 18px; font-size: 11px; border-radius: 3px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .logo, .spin, .input.bad { animation: none; }
  * { transition: none !important; }
}

/* ---------- Maintenance banner ---------- */
.mbar{position:fixed;top:0;left:0;right:0;z-index:60;background:#2a2110;color:#f0b13c;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 20px;display:flex;align-items:center;gap:12px;direction:rtl;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;font-size:15px;line-height:1.6}
.mbar[hidden]{display:none!important}
.mbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,#f0b13c 0 14px,transparent 14px 26px)}
.mbar i{flex:none;width:34px;height:34px;background:#f0b13c;color:#1a1204;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:900;font-size:20px;clip-path:polygon(0 0,calc(100% - 9px) 0,100% 9px,100% 100%,9px 100%,0 calc(100% - 9px))}
body.maint .shell{pointer-events:none;opacity:.35;filter:grayscale(.7);user-select:none}
.title.long{font-size:13px;letter-spacing:.05em;line-height:1.5;align-items:flex-start}.title.long span{white-space:normal;overflow-wrap:anywhere;padding-top:2px}.title.long svg{margin-top:-2px}
</style>

<script>
(()=>{

const ALPHA='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',HOURS=[1,3,6,12,24,72,168,720],SECRET='e3abcf227bfe053ecf90ab26a11fb1383762e7a715454fd14ba2122808468db7';
async function tagOf(head){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(SECRET),{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const b=new Uint8Array(await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(head)));
  let bits=0n;for(let i=0;i<5;i++)bits=(bits<<8n)|BigInt(b[i]);
  let out='';for(let i=7;i>=0;i--)out+=ALPHA[Number((bits>>BigInt(i*5))&31n)];return out;
}
async function sha(s){const b=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');}

const $=s=>document.querySelector(s);
const LS='xvx_license_v2';
let heartbeat=null,curRec=null,busy=false;
function pz(){return window.dskPaused?window.dskPaused():{ms:0,fresh:true}}
function effE(){return curRec?curRec.e+(pz().ms-(curRec.p||0)):0}
function load(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch{return {}}}
function save(d){try{localStorage.setItem(LS,JSON.stringify(d));return true}catch{return false}}
function setError(m){const e=$('#err');if(e)e.textContent=m;}
function busyState(on){const b=$('#authBtn');if(b)b.disabled=on;const s=$('#spin');if(s)s.hidden=!on;busy=on;}
function stop(){if(heartbeat)clearInterval(heartbeat);heartbeat=null;}
function lockApp(m){stop();const app=$('#app'),login=$('#login');if(app){app.hidden=true;app.style.display='none';}if(login){login.hidden=false;login.style.display='';}const k=$('#key');if(k)k.value='';setError(m||'انتهت صلاحية المفتاح. لا يمكن استخدامه مرة أخرى.');window.scrollTo(0,0);}
function devName(){
  const u=navigator.userAgent;let os='Unknown';
  if(/iPhone/.test(u))os='iPhone';else if(/iPad/.test(u))os='iPad';
  else if(/Android/.test(u)){const m=u.match(/Android[^;]*;\s*([^;)]+)/);const mod=m?m[1].replace(/\s*Build\/.*$/,'').trim():'';os='Android'+(mod&&!/^(K|Mobile)$/.test(mod)?' '+mod:'');}
  else if(/Windows/.test(u))os='Windows PC';else if(/Mac OS X/.test(u))os='Mac';else if(/Linux/.test(u))os='Linux';
  const br=/Edg\//.test(u)?'Edge':/OPR\//.test(u)?'Opera':/Firefox/.test(u)?'Firefox':/Chrome|CriOS/.test(u)?'Chrome':/Safari/.test(u)?'Safari':'';
  return br?os+' · '+br:os;
}
function hwid(){let v='';try{v=localStorage.getItem('xvx_hwid')||'';if(!v){v=Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();localStorage.setItem('xvx_hwid',v);}}catch{}return v?v.match(/.{1,4}/g).join('-'):'—';}
function fmtLeft(ms){if(ms<0)ms=0;const t=Math.floor(ms/1000),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60,p=n=>String(n).padStart(2,'0');return (d?d+' يوم  ':'')+p(h)+':'+p(m)+':'+p(s);}
function paintInfo(){const l=$('#leftVal');if(l)l.textContent=fmtLeft(effE()-Date.now());}
function fillInfo(){const a=$('#devVal'),b=$('#hwidVal');if(a)a.textContent=devName();if(b)b.textContent=hwid();paintInfo();}
function openApp(){const login=$('#login'),app=$('#app');if(login){login.style.display='none';login.hidden=true;}if(app){app.hidden=false;app.style.display='flex';}window.scrollTo(0,0);}
async function verify(code){
  if(!/^[A-Z2-9]{15}$/.test(code)||/[IO]/.test(code))throw new Error('مفتاح غير صحيح');
  if(!code.startsWith('XVX'))throw new Error('مفتاح غير صحيح');const idx=ALPHA.indexOf(code[3]);if(idx<0||idx>7)throw new Error('مفتاح غير صحيح');
  if(code.slice(8)!==(await tagOf(code.slice(0,8))).slice(0,7))throw new Error('مفتاح غير صحيح أو غير موجود');
  return HOURS[idx]*3600000;
}
function check(h){
  const d=load(),now=Date.now(),rec=d.used&&d.used[h];
  if(!rec)return false;
  if(d.seen&&now<d.seen-120000)return false;
  {const pr=pz();if(rec.p===undefined)rec.p=pr.ms;if(now>=rec.e+(pr.ms-rec.p)&&pr.fresh)return false;}
  d.seen=Math.max(d.seen||0,now);save(d);return true;
}
function tick(h){
  heartbeat=setInterval(()=>{paintInfo();if(!check(h))lockApp('انتهت صلاحية المفتاح. لا يمكن استخدامه مرة أخرى.');},1000);
}
document.addEventListener('submit',async e=>{
  if(!e.target||e.target.id!=='loginForm')return;
  e.preventDefault();e.stopImmediatePropagation();if(busy)return;
  const code=String($('#key')?.value||'').replace(/-/g,'').toUpperCase();
  if(code.length<15){setError('أدخل مفتاح الترخيص كاملاً.');return;}
  busyState(true);setError('');
  try{
    const dur=await verify(code),h=await sha(code),d=load();d.used=d.used||{};const now=Date.now();
    if(d.seen&&now<d.seen-120000)throw new Error('تم اكتشاف تغيير في ساعة الجهاز.');
    let rec=d.used[h];
    if(rec){const pr=pz(),p0=rec.p===undefined?pr.ms:rec.p;if(now>=rec.e+(pr.ms-p0)&&pr.fresh)throw new Error('انتهت صلاحية هذا المفتاح نهائياً');if(rec.p===undefined)rec.p=pr.ms;}
    if(!rec){rec=d.used[h]={a:now,e:now+dur,p:pz().ms};}
    d.seen=Math.max(d.seen||0,now);
    if(!save(d))throw new Error('المتصفح لا يسمح بحفظ البيانات.');
    curRec=rec;openApp();fillInfo();stop();tick(h);
      }catch(err){setError(err.message||'فشل التحقق من المفتاح.');}
  finally{busyState(false);}
},true);
document.addEventListener('click',e=>{if(e.target.closest('#logout'))stop();},true);
})();
</script>

    if (on && document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  function pull() {
    if (!MAINT_URL) { apply(readLocal()); return; }
    fetch(MAINT_URL + (MAINT_URL.indexOf("?") > -1 ? "&" : "?") + "_=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { try { localStorage.setItem(KEY, JSON.stringify(d || {})); } catch (e) {} fresh = true; apply(d); })
      .catch(function () { apply(readLocal()); });
  }
  window.addEventListener("storage", function (e) { if (e.key === KEY && !MAINT_URL) apply(readLocal()); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pull(); });
  window.addEventListener("resize", function () { if (!bar.hidden) document.body.style.paddingTop = bar.offsetHeight + "px"; });
  pull(); setInterval(pull, 4000);
})();
</script>
